<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MetroBuilder — Download</title>
    <style>
      :root {
        --bg: #050d12;
        --card: #0c1a22;
        --text: #e8f2f6;
        --muted: #8aa3b0;
        --accent: #3ecf8e;
        --gold: #f0d56a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--text);
        background:
          radial-gradient(ellipse at 20% 10%, rgba(62, 207, 142, 0.18), transparent 50%),
          radial-gradient(ellipse at 80% 90%, rgba(122, 212, 255, 0.12), transparent 45%),
          var(--bg);
        padding: 1.5rem;
      }
      main {
        width: min(520px, 100%);
        background: linear-gradient(165deg, rgba(12, 26, 34, 0.95), rgba(5, 13, 18, 0.98));
        border: 1px solid rgba(62, 207, 142, 0.28);
        border-radius: 20px;
        padding: 2rem 1.6rem;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .badge {
        display: inline-block;
        font-family: system-ui, sans-serif;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #9af0c4;
        border: 1px solid rgba(94, 234, 180, 0.35);
        background: rgba(62, 207, 142, 0.12);
        padding: 0.3rem 0.65rem;
        border-radius: 999px;
        margin-bottom: 0.85rem;
      }
      h1 {
        margin: 0 0 0.4rem;
        font-size: 2rem;
        letter-spacing: -0.02em;
        background: linear-gradient(120deg, #5eeab4, #f0d56a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0.4rem 0 1.2rem;
        color: var(--muted);
        font-family: system-ui, sans-serif;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      a.btn {
        display: inline-block;
        font-family: system-ui, sans-serif;
        font-weight: 700;
        text-decoration: none;
        color: #042218;
        background: linear-gradient(135deg, #3ecf8e, #f0d56a);
        padding: 0.85rem 1.4rem;
        border-radius: 14px;
        box-shadow: 0 10px 28px rgba(62, 207, 142, 0.28);
      }
      a.btn:hover { filter: brightness(1.05); }
      .meta {
        margin-top: 1.2rem;
        font-family: system-ui, sans-serif;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .meta a { color: var(--gold); }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">v1.4.0 · Android + iOS</div>
      <h1>MetroBuilder</h1>
      <p>
        Vollständiges Projekt zum Runterladen — bereit für Google Play und Apple App Store.
      </p>
      <a
        class="btn"
        href="https://github.com/Fidannii/Fidan/archive/refs/heads/cursor/metrobuilder-game-app-7864.zip"
      >
        ZIP jetzt herunterladen
      </a>
      <p class="meta">
        Nach dem Entpacken: <code>npm install</code> → <code>npm run cap:sync</code> →
        <a href="https://github.com/Fidannii/Fidan/blob/cursor/metrobuilder-game-app-7864/HOCHLADEN.md">HOCHLADEN.md</a>
      </p>
    </main>
  </body>
</html>
